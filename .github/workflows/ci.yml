name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    # labeled/unlabeled: re-run the structure gate when "structure-exception"
    # is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import boundaries (import-linter)
        run: uv run lint-imports

      - name: Structure gate (file and function size)
        env:
          STRUCTURE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'structure-exception') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            uv run python scripts/check_structure.py --base "origin/$BASE_REF"
          else
            uv run python scripts/check_structure.py
          fi

      - name: Pytest with coverage
        run: uv run pytest --cov=src/optimus --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
